<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EEF2FA"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E3F2FD"/><stop offset="100%" stop-color="#BBDEFB"/></linearGradient>
    <linearGradient id="gBlue2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E1F5FE"/><stop offset="100%" stop-color="#B3E5FC"/></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3E5F5"/><stop offset="100%" stop-color="#E1BEE7"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFDE7"/><stop offset="100%" stop-color="#FFF9C4"/></linearGradient>
    <linearGradient id="gGrey" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ECEFF1"/><stop offset="100%" stop-color="#CFD8DC"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474F"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="url(#gBg)"/>
  <text x="600.0" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#1A237E">My Secure IDE — runtime architecture</text>
  <text x="600.0" y="61" text-anchor="middle" font-size="14" font-style="italic" fill="#546E7A">VS Code + Claude Code run inside a Docker Sandbox; only the IDE window reaches the host</text>
  <g filter="url(#shadow)"><rect x="30" y="140" width="200" height="110" rx="16" fill="url(#gBlue)" stroke="#1565C0" stroke-width="2"/></g>
  <text x="130.0" y="177.0" text-anchor="middle" font-size="22">🖥️</text>
  <text x="130.0" y="201.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0D47A1">Host desktop</text>
  <text x="130.0" y="219.0" text-anchor="middle" font-size="12" fill="#0D47A1">macOS · Windows · Linux</text>
  <text x="130.0" y="235.0" text-anchor="middle" font-size="12" fill="#0D47A1">shows the VS Code window</text>
  <rect x="320" y="95" width="540" height="545" rx="10" fill="none" stroke="#90A4AE" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="590.0" y="117" text-anchor="middle" font-size="13" font-style="italic" font-weight="700" fill="#607D8B">Docker Sandbox (microVM) — kit my-secure-ide</text>
  <g filter="url(#shadow)"><rect x="360" y="140" width="460" height="110" rx="16" fill="url(#gPurple)" stroke="#6A1B9A" stroke-width="3"/></g>
  <text x="590.0" y="177.0" text-anchor="middle" font-size="22">🧑‍💻</text>
  <text x="590.0" y="201.0" text-anchor="middle" font-size="16" font-weight="700" fill="#4A148C">VS Code (Electron)</text>
  <text x="590.0" y="219.0" text-anchor="middle" font-size="12" fill="#4A148C">entrypoint · Wayland client · software rendering</text>
  <text x="590.0" y="235.0" text-anchor="middle" font-size="12" fill="#4A148C">opens the mounted workspace</text>
  <rect x="710.6" y="128" width="95.4" height="24" rx="12" fill="#6A1B9A"/>
  <text x="758.3000000000001" y="144.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">★ entrypoint</text>
  <g filter="url(#shadow)"><rect x="360" y="300" width="460" height="100" rx="16" fill="url(#gBlue2)" stroke="#0277BD" stroke-width="2"/></g>
  <text x="590.0" y="340.0" text-anchor="middle" font-size="22">🤖</text>
  <text x="590.0" y="364.0" text-anchor="middle" font-size="16" font-weight="700" fill="#01579B">Claude Code</text>
  <text x="590.0" y="382.0" text-anchor="middle" font-size="12" fill="#01579B">VS Code extension + claude CLI</text>
  <g filter="url(#shadow)"><rect x="360" y="460" width="460" height="90" rx="16" fill="url(#gYellow)" stroke="#F9A825" stroke-width="2"/></g>
  <text x="590.0" y="495.0" text-anchor="middle" font-size="22">🗃</text>
  <text x="590.0" y="519.0" text-anchor="middle" font-size="16" font-weight="700" fill="#F57F17">Workspace</text>
  <text x="590.0" y="537.0" text-anchor="middle" font-size="12" fill="#F57F17">your project, mounted from the host</text>
  <text x="590" y="600" text-anchor="middle" font-size="12" font-style="italic" fill="#78909C">host files outside the workspace stay out of reach</text>
  <g filter="url(#shadow)"><rect x="930" y="300" width="240" height="100" rx="16" fill="url(#gGrey)" stroke="#455A64" stroke-width="2"/></g>
  <text x="1050.0" y="332.0" text-anchor="middle" font-size="22">🛡️</text>
  <text x="1050.0" y="356.0" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">sbx network policy</text>
  <text x="1050.0" y="374.0" text-anchor="middle" font-size="12" fill="#263238">allow: *.anthropic.com · claude.ai</text>
  <text x="1050.0" y="390.0" text-anchor="middle" font-size="12" fill="#263238">deny: everything else</text>
  <g filter="url(#shadow)"><rect x="930" y="470" width="240" height="80" rx="16" fill="url(#gBlue2)" stroke="#0277BD" stroke-width="2"/></g>
  <text x="1050.0" y="508.0" text-anchor="middle" font-size="22">🌐</text>
  <text x="1050.0" y="532.0" text-anchor="middle" font-size="16" font-weight="700" fill="#01579B">Anthropic API</text>
  <path d="M232,195 L358,195" fill="none" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="236.0" y="148.0" width="80" height="36" rx="4" fill="#FAFBFF"/>
  <text x="276" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">Wayland</text>
  <text x="276" y="178" text-anchor="middle" font-size="11" fill="#455A64">window only</text>
  <path d="M590,250 L590,298" fill="none" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="620.0" y="264.0" width="120" height="20" rx="4" fill="#FAFBFF"/>
  <text x="680" y="278.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">hosts the agent</text>
  <path d="M590,400 L590,458" fill="none" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="620.0" y="419.0" width="140" height="20" rx="4" fill="#FAFBFF"/>
  <text x="690" y="433.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">reads / edits files</text>
  <path d="M822,350 L928,350" fill="none" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="867.0" y="340.0" width="54" height="20" rx="4" fill="#FAFBFF"/>
  <text x="894" y="354.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">HTTPS</text>
  <path d="M1050,400 L1050,468" fill="none" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1065.0" y="424.0" width="70" height="20" rx="4" fill="#FAFBFF"/>
  <text x="1100" y="438.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">allowed</text>
</svg>
